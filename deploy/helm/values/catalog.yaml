# catalog-service — M2 Fleet & Catalogue
#
# Values that differ from deploy/helm/rentez-service/values.yaml. Anything shared
# by all five services belongs there, not here.

serviceName: catalog-service


database:
  user: fleet_user
  passwordParameter: fleet-db-password

# 2 to 6, more headroom than account because catalog is on the SYNCHRONOUS path
# of every booking: reservation calls it for a quote and for rentability. The
# architecture doc flags that call as edge 2 of a coupling cycle - if catalog is
# slow, booking creation stalls behind it. Extra replicas are a mitigation, not
# a fix; the fix is a circuit breaker.

ingress:
  enabled: true
  path: /api/catalog
  order: 101

# minReplicas 3, not 2. In the AWS stress test (2026-09-27) catalog ran out
# of its 3 database connections at 3-4 pods, with CPU only 70-90% of its
# request - not far enough over the 60% target to scale quickly - and
# failed ~11,000 requests before reaching 6 pods at minute 11. Starting at 3
# gives it 9 connections before the HPA has to react. The maximum, and so
# the RDS connection budget, is unchanged. The real fix is to scale on
# hikaricp.connections.pending rather than CPU (docs/quality-attributes.md).
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
