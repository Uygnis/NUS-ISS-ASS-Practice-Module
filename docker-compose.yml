# RentEZ — local development stack
# rentez_startup_project_v1_1_20260810_1421SGT
#
# TWO MODES, ONE FILE. See docs/ch01.startup-project.adoc.
#
#   docker compose up -d                      Mode A — infrastructure only
#   docker compose --profile app up -d --build  Mode B — everything
#
# Service ports are unchanged from the original file: account 8081,
# reservation 8082, catalog 8083, notification 8084, frontend 3000.

name: rentez

# ---------------------------------------------------------------- anchors
# Shared by all five Spring Boot services. Per-service values (schema, user,
# password) are set on each service below.
x-spring-env: &spring-env
  DB_HOST: postgres
  # ALWAYS 5432. This is the CONTAINER-side port — Postgres inside the container
  # listens on 5432 no matter what host port you map it to. POSTGRES_PORT in .env
  # moves only the host side, for IntelliJ / Adminer / a psql client on your Mac.
  DB_PORT: "5432"
  # ONE database, five schemas. Which schema a service sees is decided by its
  # role's search_path (db/init/01-schemas.sql), not by the connection URL, so
  # every service points at the same DB_NAME and only DB_USER differs.
  DB_NAME: rentez
  # DynamoDB Local speaks the real DynamoDB API, so application code uses the
  # unmodified AWS SDK. Unset on AWS, where the SDK resolves the real endpoint.
  RENTEZ_AWS_DYNAMODB_ENDPOINT: http://dynamodb:8000
  AWS_REGION: ${AWS_REGION:-ap-southeast-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-localsecret}
  RENTEZ_JWT_SECRET: ${RENTEZ_JWT_SECRET:-local-dev-secret-change-me-min-32-chars}
  # Empty by default. Set SPRING_PROFILES_ACTIVE=seed to load the demo admin,
  # staff and customer accounts and the starter fleet:
  #
  #   SPRING_PROFILES_ACTIVE=seed make up
  #
  # The seeders are profile-gated because Postgres persists between runs, unlike the
  # monolith's in-memory H2 - unconditional seeding would violate the email
  # unique constraint on the second boot. They are also idempotent, so re-running
  # with the profile on is safe.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
  # Service-to-service base URLs. These bypass the gateway deliberately: the
  # gateway is the PUBLIC edge and returns 404 for every /internal path, which
  # is exactly what these calls use. Docker's embedded DNS resolves the service
  # names, and every service listens on 8080 inside its own container - the
  # 8081-8085 numbers below are host mappings only.
  RENTEZ_CATALOG_BASE_URL: http://catalog-service:8080
  RENTEZ_RESERVATION_BASE_URL: http://reservation-service:8080
  RENTEZ_NOTIFICATION_BASE_URL: http://notification-service:8080
  RENTEZ_PAYMENT_BASE_URL: http://payment-service:8080
  # Without this the JVM sizes its heap from the DOCKER VM's memory, not the
  # container limit, and five JVMs each claim ~2 GB. 70% of a 768m limit
  # leaves headroom for metaspace, threads and native buffers.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
  # db.t4g.micro running Postgres allows ~112 connections. Twenty-five pods at
  # max scale-out with a pool of 5 want 125 and would exhaust it during the load
  # test; 3 wants 75. Keep local and AWS identical.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"

x-spring-healthcheck: &spring-healthcheck
  # Bash's /dev/tcp needs no extra packages. Once `curl` is added to the
  # runtime image, switch to:
  #   ["CMD","curl","-sf","http://localhost:8080/actuator/health/readiness"]
  test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 60s

x-spring-depends: &spring-depends
  postgres:
    condition: service_healthy
  dynamodb-init:
    condition: service_completed_successfully

services:

  # ==================================================== INFRASTRUCTURE
  # No profile — these start with a bare `docker compose up`.

  postgres:
    image: postgres:16-alpine
    # 200 is deliberately MORE than RDS db.t4g.micro's ~112, so the local stack
    # survives what RDS will not. That gap is a known hazard, not an oversight:
    # a pool misconfiguration cannot reproduce locally and surfaces for the first
    # time during the graded load test. See the architecture doc, panel C.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentez}
      # db/init/01-schemas.sql runs inside THIS database and creates the five
      # schemas within it.
      POSTGRES_DB: ${POSTGRES_DB:-rentez}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Postgres runs this directory ONCE, on first boot of an empty data volume.
      # Editing 01-schemas.sql afterwards has no effect — use `make clean`.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 rather than the default unix socket: the socket accepts
      # connections during initdb, while the TCP listener only opens once the
      # server is genuinely ready for clients. Without the host flag the stack
      # races ahead and the services fail their first connection attempt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${POSTGRES_DB:-rentez}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 640m

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    user: root                      # required to write to the mounted volume
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb-data:/data
    mem_limit: 512m
    # No healthcheck: this image ships neither curl nor nc, and DynamoDB Local
    # answers an unsigned GET with HTTP 400. dynamodb-init retries instead.

  # One-shot. Creates the three tables with the key schemas the PRDs specify,
  # then exits. Idempotent.
  dynamodb-init:
    image: amazon/aws-cli:2.27.0
    entrypoint: ["/bin/sh", "/init-dynamodb.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-localsecret}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
      DDB_ENDPOINT: http://dynamodb:8000
    volumes:
      - ./scripts/init-dynamodb.sh:/init-dynamodb.sh:ro
    depends_on:
      - dynamodb

  adminer:
    image: adminer:5
    ports:
      - "${ADMINER_PORT:-8090}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m

  # Single entry point on :8080, routing by path exactly as the AWS ALB does.
  # The frontend therefore uses ONE base URL in both environments.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./scripts/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1, NOT localhost. gateway.conf declares `listen 80;` which binds
      # IPv4 only, and nginx's 10-listen-on-ipv6-by-default.sh cannot add the IPv6
      # listener because the config above is mounted read-only. Inside the
      # container `localhost` resolves to ::1 first, so the probe was refused and
      # the gateway sat permanently unhealthy while serving traffic perfectly.
      # Matches the 127.0.0.1 the Spring healthchecks already use.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    # Deliberately no depends_on: gateway.conf resolves service names lazily,
    # so the gateway starts cleanly in Mode A when no services are running.

  # ========================================================= APPLICATION
  # profiles: ["app"] — these start only with `--profile app`.

  account-service:
    profiles: ["app"]
    build:
      context: ./services/account-service
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      <<: *spring-env
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pw}
    depends_on: *spring-depends
    healthcheck: *spring-healthcheck
    mem_limit: 768m

  reservation-service:
    profiles: ["app"]
    build:
      context: ./services/reservation-service
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8080"
    environment:
      <<: *spring-env
      DB_USER: booking_user
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pw}
    depends_on: *spring-depends
    healthcheck: *spring-healthcheck
    mem_limit: 768m

  catalog-service:
    profiles: ["app"]
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile.dev
    ports:
      - "8083:8080"
    environment:
      <<: *spring-env
      DB_USER: fleet_user
      DB_PASSWORD: ${FLEET_DB_PASSWORD:-fleet_pw}
    depends_on: *spring-depends
    healthcheck: *spring-healthcheck
    mem_limit: 768m

  notification-service:
    profiles: ["app"]
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
    ports:
      - "8084:8080"
    environment:
      <<: *spring-env
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_pw}
    depends_on: *spring-depends
    healthcheck: *spring-healthcheck
    mem_limit: 768m

  # PRD module M4. The rentez_payment schema, payment_user and
  # PAYMENT_DB_PASSWORD were provisioned in db/init/01-schemas.sql and .env.example
  # long before this service existed, so nothing about database setup changes here.
  payment-service:
    profiles: ["app"]
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.dev
    ports:
      - "8085:8080"
    environment:
      <<: *spring-env
      DB_USER: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pw}
    depends_on: *spring-depends
    healthcheck: *spring-healthcheck
    mem_limit: 768m

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      # The API base URL is relative ("") in every environment — see the long
      # note in frontend/vite.config.js. Inside this container the dev server
      # proxies /api to the gateway by SERVICE NAME, because `localhost` here is
      # the frontend container itself, not the host.
      VITE_DEV_API_PROXY: http://gateway:80
    volumes:
      - ./frontend:/app
      # A NAMED volume, not an anonymous one. With an anonymous volume, adding a
      # dependency to package.json and rebuilding silently reuses the OLD
      # node_modules and the new package appears missing. Named means you can
      # purge it deliberately: docker volume rm rentez_frontend-node-modules
      - frontend-node-modules:/app/node_modules
    mem_limit: 1g
    # CHOKIDAR_USEPOLLING removed: that is a create-react-app convention. Vite
    # does not read it. If file watching misbehaves on your machine, set
    # server.watch.usePolling in vite.config.js instead.

volumes:
  postgres-data:
  dynamodb-data:
  frontend-node-modules:

# NOTE ON THE MAVEN CACHE
# A compose volume cannot speed up Maven, because `mvn package` runs at IMAGE
# BUILD time and volumes only exist at run time. The fix belongs in
# services/*/Dockerfile.dev — either a dependency-only layer:
#     COPY pom.xml .
#     RUN mvn -B dependency:go-offline
#     COPY src ./src
# or a BuildKit cache mount:
#     RUN --mount=type=cache,target=/root/.m2 mvn -B clean package -DskipTests
