# WARNING: this file SHADOWS src/main/resources/application.properties - it does
# not merge with it. Both are `application.properties` on the classpath and the
# test copy wins outright, so anything the application needs at startup has to be
# repeated here or the context fails to build.
#
# That bit once already: adding this file with only the relay flag in it removed
# every rentez.* property and broke bean creation with
# "Could not resolve placeholder 'rentez.catalog.base-url'". More quietly, it also
# dropped ddl-auto=validate, which would have disabled the entity/DDL drift check
# in the one place it actually runs. If you add a @Value to main config, add it
# here too.

spring.application.name=reservation-service

# No datasource settings: Testcontainers supplies them through @ServiceConnection.

# Kept identical to production. This is what makes the tests fail when an entity
# and its Flyway migration disagree - the whole reason Testcontainers is here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

rentez.jwt.secret=demo-only-secret-key-change-me-please-32bytes-min

# Never actually called: CatalogClient and NotificationClient are replaced with
# mocks in every test. The values only have to exist so the beans can be built.
rentez.catalog.base-url=http://catalog-service.invalid
rentez.notification.base-url=http://notification-service.invalid

# The relay is driven explicitly in tests rather than on a timer. A background
# tick firing partway through an assertion makes "has it been delivered yet?" a
# race rather than a fact.
rentez.outbox.relay.enabled=false
