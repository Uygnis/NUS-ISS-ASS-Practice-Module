spring.application.name=CarRental-NUSISS

# --- H2 in-memory database (resets every restart; swap for Postgres/MySQL later) ---
spring.datasource.url=jdbc:h2:mem:carrental;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- CORS ---
# 5173 = `npm run dev` straight from the frontend folder; 3000 = the port docker-compose maps it to.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- JWT ---
# Demo secret only - move to an env var (JWT_SECRET) before this ever sees production.
app.jwt.secret=${JWT_SECRET:demo-only-secret-key-change-me-please-32bytes-min}
app.jwt.expiration-ms=86400000

server.port=8080
