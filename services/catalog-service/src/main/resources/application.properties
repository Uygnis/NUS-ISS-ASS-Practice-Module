spring.application.name=catalog-service

# -------------------------------------------------------------- datasource
# The defaults are the IntelliJ values, so `make infra` + Run works with no
# configuration at all. Docker Compose overrides DB_HOST/DB_NAME/DB_USER/
# DB_PASSWORD. One properties file, both development modes, no profiles.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rentez}
spring.datasource.username=${DB_USER:fleet_user}
spring.datasource.password=${DB_PASSWORD:fleet_pw}

# db.t4g.micro running Postgres allows ~112 connections (max_connections is
# LEAST(DBInstanceClassMemory/9531392, 5000)), of which 3 are reserved for
# superusers. Twenty-five pods at max scale-out with a pool of 5 want 125 and
# would exhaust it at exactly the moment the HPA starts working; 3 wants 75,
# comfortably inside. This is Stage 1 of the scaling plan and it is free.
spring.datasource.hikari.maximum-pool-size=3

# Flyway owns the schema; Hibernate must never create or alter tables - see
# docs/ch02.database-schema.adoc. `validate` (not `none`) turns entity/DDL drift
# into a startup failure instead of a runtime one, which is worth having with
# hand-written migrations. Boot always runs Flyway before Hibernate validates.
#
# spring.flyway.schemas is deliberately NOT set: Flyway then uses the connection's
# default schema. That is rentez_fleet here, because db/init/01-schemas.sql
# does ALTER ROLE ... SET search_path, and `public` inside the throwaway
# Testcontainers database under test. Pinning it would break every
# integration test.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- security
# HS256 secret shared with account-service, which issues the tokens. Validation
# is local to each service, so nothing calls account-service on the hot path.
rentez.jwt.secret=${RENTEZ_JWT_SECRET:demo-only-secret-key-change-me-please-32bytes-min}

# ---------------------------------------------------------------- actuator
# probes.enabled is REQUIRED: Kubernetes readiness/liveness probes and the ALB
# target group hit /actuator/health/readiness and /liveness. Without it both
# return 404, pods never become ready, and the deploy appears to hang.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# `always` for local development. Switch to when_authorized once Spring
# Security is in place, so health details are not public.
management.endpoint.health.show-details=always
