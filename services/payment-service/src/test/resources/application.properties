# WARNING: this file SHADOWS src/main/resources/application.properties - it does
# not merge with it. Both are `application.properties` on the classpath and the
# test copy wins outright, so anything the application needs at startup has to be
# repeated here or the context fails to build. If you add a @Value to main
# config, add it here too.

spring.application.name=payment-service

# No datasource settings: Testcontainers supplies them through @ServiceConnection.

# Identical to production, so an entity that disagrees with its Flyway migration
# fails the build rather than the deployment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

rentez.jwt.secret=demo-only-secret-key-change-me-please-32bytes-min

# Never called: both clients are replaced with mocks. The values only need to
# exist so the beans can be constructed.
rentez.reservation.base-url=http://reservation-service.invalid
rentez.notification.base-url=http://notification-service.invalid

# Both background jobs are driven explicitly in tests. A timer firing partway
# through an assertion turns "has the saga finished?" into a race.
rentez.outbox.relay.enabled=false
rentez.reconciliation.enabled=false
