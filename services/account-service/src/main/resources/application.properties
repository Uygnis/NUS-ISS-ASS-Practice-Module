spring.application.name=account-service

# -------------------------------------------------------------- datasource
# The defaults are the IntelliJ values, so `make infra` + Run works with no
# configuration at all. Docker Compose overrides DB_HOST/DB_NAME/DB_USER/
# DB_PASSWORD. One properties file, both development modes, no profiles.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rentez_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_pw}

# db.t4g.micro allows ~85 connections. Ten booking pods at Hikari's default
# pool of 10 would exhaust it at exactly the moment the HPA starts working.
spring.datasource.hikari.maximum-pool-size=5

# ------------------------------------------------------------------ schema
# Flyway owns the schema; Hibernate only checks that the entities match what
# Flyway built. `validate` (not `none`) turns entity/DDL drift into a startup
# failure instead of a runtime one - worth having with hand-written migrations.
# Boot always runs Flyway before Hibernate validates, so the ordering is safe.
#
# spring.flyway.schemas is deliberately NOT set: Flyway then uses the connection's
# default schema, which is rentez_auth here and the random Testcontainers
# database under test. Pinning it would break every integration test.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- security
# account-service is the sole ISSUER of JWTs; every other service only validates
# them, locally, against this same HS256 secret. Nothing calls account-service
# on the request path as a result.
rentez.jwt.secret=${RENTEZ_JWT_SECRET:demo-only-secret-key-change-me-please-32bytes-min}

# 15 minutes, deliberately NOT the monolith's 24 hours. Authorization is now
# read from the token's claims instead of re-reading the user row on every
# request, so a disabled or demoted account keeps its access until the token
# expires. That window is the price of dropping the per-request lookup; keep it
# short. Real revocation (the rentez-sessions DynamoDB table, keyed on jti) is
# deferred - see the plan.
rentez.jwt.expiration-ms=${RENTEZ_JWT_EXPIRATION_MS:900000}

# ------------------------------------------------------------ integrations
# Admin reporting composes /internal/stats from the other services. Read-only
# and fail-soft: a slow catalog must never delay a login.
rentez.catalog.base-url=${RENTEZ_CATALOG_BASE_URL:http://localhost:8083}
rentez.reservation.base-url=${RENTEZ_RESERVATION_BASE_URL:http://localhost:8082}
rentez.payment.base-url=${RENTEZ_PAYMENT_BASE_URL:http://localhost:8085}

# ---------------------------------------------------------------- actuator
# probes.enabled is REQUIRED: Kubernetes readiness/liveness probes and the ALB
# target group hit /actuator/health/readiness and /liveness. Without it both
# return 404, pods never become ready, and the deploy appears to hang.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# `always` for local development. Switch to when_authorized once Spring
# Security is in place, so health details are not public.
management.endpoint.health.show-details=always
