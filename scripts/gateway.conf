# RentEZ — local API gateway
# rentez_startup_project_v1_1_20260810_1421SGT
#
# Mirrors the path routing the AWS Application Load Balancer performs, so the
# React app uses ONE base URL (http://localhost:8080) in both environments
# instead of five ports locally and a hostname in production.
#
# The path prefixes below must stay in step with `ingress.path` in
# deploy/helm/values/*.yaml.

server {
    listen 80;
    server_name _;

    # CORS
    add_header Access-Control-Allow-Origin "http://localhost:3000" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # Handle browser preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Docker's embedded DNS. Combined with the variables below, this defers
    # hostname resolution to REQUEST time. Without it, nginx resolves upstream
    # names at STARTUP and refuses to start with "host not found in upstream"
    # whenever the services are not running — which is exactly Mode A.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout;

    # Used by the container healthcheck; answers even when no service is up.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Service-to-service endpoints are NOT public. Every prefix location below
    # matches its own /internal paths too (location /api/reservations also
    # matches /api/reservations/internal/...), which would publish the saga
    # confirm/cancel calls and the stats endpoints straight to the internet.
    #
    # nginx evaluates regex locations BEFORE prefix locations, so this one block
    # shadows all five. It is the edge half of the control only - services also
    # require a SERVICE-role JWT on these paths, because docker-compose maps
    # 8081-8085 on the host and anything on this machine can skip the gateway.
    location ~ ^/api/(accounts|catalog|reservations|notifications|payments)/internal {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # NOTE: when proxy_pass contains a variable, nginx does not perform its
    # usual location-prefix substitution. Appending $request_uri states the
    # forwarded path explicitly and passes it exactly as the client sent it,
    # query string included, with no re-encoding.
    location /api/accounts {
        set $upstream_account http://account-service:8080;
        proxy_pass $upstream_account$request_uri;
    }

    location /api/catalog {
        set $upstream_catalog http://catalog-service:8080;
        proxy_pass $upstream_catalog$request_uri;
    }

    location /api/reservations {
        set $upstream_reservation http://reservation-service:8080;
        proxy_pass $upstream_reservation$request_uri;
    }

    location /api/notifications {
        set $upstream_notification http://notification-service:8080;
        proxy_pass $upstream_notification$request_uri;
    }

    # PRD module M4. Note this is the one service whose gateway prefix is also
    # its resource name, so /api/payments survives the split from the monolith
    # unchanged - do not nest it as /api/payments/payments.
    location /api/payments {
        set $upstream_payment http://payment-service:8080;
        proxy_pass $upstream_payment$request_uri;
    }

    # A clearer failure than a bare 502 when a service is not running.
    error_page 502 504 = @service_down;
    location @service_down {
        default_type application/json;
        return 503 '{"error":"service_unavailable","hint":"Start it with: docker compose --profile app up -d"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","hint":"Routes: /api/accounts, /api/catalog, /api/reservations, /api/notifications, /api/payments"}';
    }
}
