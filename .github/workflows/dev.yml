name: Deploy Dev

on:
  workflow_run:
    workflows:
      - "Rentez CI"
    types:
      - completed
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
