name: Rentez CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - catalog-service
          - notification-service
          - payment-service
          - reservation-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 21 everywhere. The poms, the Dockerfiles and this workflow used to
      # disagree (17 / 21 / 17); `make check` already warns on anything but 21.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # Integration tests start a real MySQL 8 container via Testcontainers
      # (@ServiceConnection). ubuntu-latest ships a working Docker daemon, so no
      # service container is needed here. This is also the only place the Flyway
      # migrations are executed automatically.
      - name: Build and run tests
        run: ./mvnw verify

  ###############################################################################
  # Code Coverage
  ###############################################################################

  # Uncomment after adding JaCoCo
  # - name: Upload JaCoCo Report
  #   if: always()
  #   uses: actions/upload-artifact@v4
  #   with:
  #     name: jacoco-${{ matrix.service }}
  #     path: services/${{ matrix.service }}/target/site/jacoco/

  ###############################################################################
  # Static Application Security Testing
  ###############################################################################

  sast:
    name: SAST - CodeQL Scan
    needs: [frontend, backend]
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,java
          queries: security-extended,security-and-quality

      # Build Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Build Backend
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Loops over services/*/ rather than listing each one. The previous form
      # hard-coded four copy-pasted steps, so a newly added service was silently
      # excluded from the scan until someone remembered to edit this file.
      - name: Build all services
        run: |
          for dir in services/*/; do
            echo "::group::Building ${dir}"
            (cd "${dir}" && chmod +x mvnw && ./mvnw -B clean compile -DskipTests)
            echo "::endgroup::"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  ###############################################################################
  # Software Composition Analysis
  ###############################################################################

  # security scan
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "RentEZ"
          path: "."
          format: "HTML"
          out: "reports"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
