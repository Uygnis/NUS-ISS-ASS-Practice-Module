name: Rentez Deploy

# Builds the five service images to ECR and rolls them onto the EKS cluster.
# Called by dev.yml and prod.yml when Rentez CI passes; never triggered directly
# by a push, so a deploy can never reference a commit whose tests failed.
#
# It runs `make aws-deploy` — the same script a developer runs locally — rather
# than reimplementing a deploy in YAML, so there is exactly one description of
# what deploying means. Bringing the environment UP is still `make aws-up` from
# a laptop: that creates hourly-billed resources and takes twenty minutes, and a
# workflow should not be able to start spending money on its own.
#
# NO GHCR, AND NO GITHUB_TOKEN.
# An earlier version pushed to GitHub Container Registry. That proved the
# artifact publishing worked, and was then dropped: EKS pulls from ECR using the
# node instance profile, so there is no registry credential in the cluster at
# all. With GHCR gone every leg of this pipeline talks to AWS, and GITHUB_TOKEN
# cannot authenticate to AWS under any configuration — hence `id-token: write`
# and OIDC, and no `packages: write` anywhere.
#
# EXPECT THIS TO FAIL WHEN NOBODY HAS RUN `make aws-up`.
# The environment holds a 4-hour lease and a reaper tears it down when it
# expires, so most merges outside a working session land with no cluster to
# deploy to. The run fails in about thirty seconds with "no cluster 'rentez' —
# someone has to run 'make aws-up' first", which is the honest answer. It is not
# a broken pipeline, and it is not something to fix by removing the check.
#
# OPTIONAL, AND OFF UNLESS CONFIGURED.
# The account a run deploys to is decided by AWS_DEPLOY_ROLE_ARN, read from the
# GitHub Environment named by the `environment` input. With no Environment
# configured the workflow deploys nothing and says so in the job summary, which
# is the normal state for anyone deploying from their laptop with
# `make aws-images` and `make aws-deploy`.
#
# WHY ENVIRONMENTS RATHER THAN ONE REPOSITORY VARIABLE.
# The team has per-member AWS accounts. A single repository variable can only
# point at one of them, so whoever set it last owned everyone's deploys and
# spent their own budget doing it. An Environment per member lets each person
# press Run workflow against their own account, and dev.yml and prod.yml keep
# working by passing environment: dev and environment: prod.
#
# TO SET UP YOUR OWN (once per AWS account):
#   1. Create a GitHub OIDC identity provider:
#        aws iam create-open-id-connect-provider \
#          --url https://token.actions.githubusercontent.com \
#          --client-id-list sts.amazonaws.com \
#          --thumbprint-list 1c58a3a8518e8759bf075b76b750d4f2df264fcd
#   2. Create a role trusting this repository only, with the policy in
#      aws/iam/ci-deploy-policy.json.
#   3. Create a GitHub Environment (Settings > Environments) and set
#      AWS_DEPLOY_ROLE_ARN on it, plus AWS_REGION if you are not in
#      ap-southeast-1. These are Environment variables, not repository ones.
#   4. Export CI_ROLE_ARN=<that role> before running `make aws-up`, so the
#      cluster grants it an EKS access entry. IAM permission is NOT cluster
#      permission; skip this and every deploy dies with "You must be logged in
#      to the server (Unauthorized)". The cluster is ephemeral, so this has to
#      be redone on every aws-up.
#   5. Actions > Rentez Deploy > Run workflow, and name your Environment.
#
# The shared dev and prod Environments work the same way; they just happen to
# be named by dev.yml and prod.yml rather than typed in by hand.
#
# There are deliberately NO long-lived AWS access keys in GitHub secrets. OIDC
# issues a short-lived credential per run, which is both safer and one less
# thing to rotate when somebody leaves the team.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: >-
          GitHub Environment to deploy with. Its AWS_DEPLOY_ROLE_ARN decides
          which AWS account this run touches, so put your own name here to
          deploy to your own environment.
        required: false
        default: manual

concurrency:
  # Deliberately NOT keyed on the ref. dev and main deploy to the SAME cluster,
  # and two concurrent Helm rolls interleave their releases with the loser
  # winning. Queue instead.
  group: deploy
  # And deliberately not cancel-in-progress: a half-applied deploy is worse than
  # a slow one. Never kill a running roll to start a newer one.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# NO WORKFLOW-LEVEL env FOR AWS_REGION.
# Workflow-level `env` is evaluated before any job binds its Environment, so it
# only ever sees repository-level variables and would silently ignore a
# per-member AWS_REGION. Each job that needs the region resolves it inline
# instead, where the Environment is already bound.

jobs:
  # ------------------------------------------------------------- 0. preflight
  # Exists only to answer "is this Environment configured?" from inside a job,
  # where environment-scoped variables are guaranteed to resolve.
  #
  # The gate used to be `if: vars.AWS_DEPLOY_ROLE_ARN != ''` on the build job. A
  # job-level `if` is evaluated before the job binds its Environment, so with
  # per-member Environments that check reads only the repository-level variable
  # and skips every correctly configured run. Gating on another job's output
  # sidesteps the ordering question entirely.
  #
  # Only a boolean crosses the job boundary. The ARN itself stays inside the
  # jobs that use it rather than becoming a job output.
  preflight:
    name: Check environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Check for a deploy role
        id: check
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Nothing was deployed"
            echo ""
            echo "Environment \`$ENVIRONMENT\` has no \`AWS_DEPLOY_ROLE_ARN\` variable,"
            echo "so there is no AWS account to deploy to and the build and deploy jobs"
            echo "were skipped."
            echo ""
            echo "To point this Environment at an AWS account, see the setup notes at the"
            echo "top of .github/workflows/deploy.yml."
          } >> "$GITHUB_STEP_SUMMARY"

          # Deliberately not a failure. An unconfigured Environment is the
          # normal state for a teammate who deploys from their laptop, and a red
          # X on every merge would train the team to ignore this workflow. The
          # job summary is the signal instead — the previous silent skip left no
          # trace at all, which is how a green run that deployed nothing went
          # unnoticed.
  # ---------------------------------------------------------------- 1. build
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    environment: ${{ inputs.environment }}

    outputs:
      short: ${{ steps.tags.outputs.short }}

    strategy:
      fail-fast: false
      matrix:
        # The frontend is deliberately absent. It is not a container in this
        # architecture: aws-deploy.sh runs `npm run build` and syncs the result
        # to S3 behind CloudFront.
        service:
          - account-service
          - catalog-service
          - notification-service
          - payment-service
          - reservation-service

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # `make aws-deploy` defaults TAG to `git rev-parse --short=7`, so the short
      # form is the one a developer deploys by hand. Pushing both means either
      # works, and a full SHA copied out of a CI log is never a dead end.
      - name: Resolve tags
        id: tags
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile.dev
          push: true
          # linux/amd64 explicitly: the node group is t3/m5, which are x86. An
          # arm64 image fails at runtime with "exec format error", which does
          # not mention architecture and wastes an afternoon.
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/rentez-${{ matrix.service }}:${{ steps.tags.outputs.short }}
            ${{ steps.ecr.outputs.registry }}/rentez-${{ matrix.service }}:${{ github.sha }}
          # GitHub's own cache, so the Maven dependency layer survives between
          # runs. Dockerfile.dev has no BuildKit cache mount of its own, so
          # without this every run re-resolves the whole tree, five times over.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # --------------------------------------------------------------- 2. deploy
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [preflight, build]
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      # aws-deploy.sh builds the frontend for real before syncing it to S3.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      # eksctl is not installed: this half creates no infrastructure.

      # aws-deploy.sh reads AWS_REGION from the environment for
      # `aws eks update-kubeconfig`, so it is set here rather than inherited.
      - name: Deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
        run: make aws-deploy TAG=${{ needs.build.outputs.short }}

      # dev and main share one cluster, so the last deploy wins. This line is
      # the only record of which branch put what there.
      - name: Report
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name rentez-persistent \
                  --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          {
            echo "Deployed \`${{ needs.build.outputs.short }}\` from **${{ inputs.environment }}** to $URL"
            echo ""
            echo "One cluster is shared by dev and main — the most recent deploy is what is live."
          } >> "$GITHUB_STEP_SUMMARY"
