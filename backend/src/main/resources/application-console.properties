# Settings for the text-based console harness (CarRentalConsoleApp, standalone mode).
# Only active when the "console" profile is on - the normal web boot is untouched.

# No Tomcat, no port 8080: the harness calls the services in-process.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Pinned so the harness never depends on Docker/MySQL even if SPRING_DATASOURCE_*
# is set in the environment. Embedded, in-memory, fresh on every run.
spring.datasource.url=jdbc:h2:mem:carrental-console;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Quiet the framework down so the menu stays readable, but keep our own logs
# (NotificationService prints every notification it "sends" at INFO).
logging.level.root=WARN
logging.level.com.CarRental_NUSISS=INFO
logging.pattern.console=%clr(%-5level) %clr(%logger{0}){cyan} : %msg%n
spring.jpa.open-in-view=false
